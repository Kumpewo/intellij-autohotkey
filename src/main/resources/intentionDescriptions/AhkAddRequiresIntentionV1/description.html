<body>
Inserts <code>#Requires AutoHotkey v1.1</code> as the first line of a script without <code>#Requires AutoHotkey</code>
whose code looks like AutoHotkey v1 (syntax detection of the AutoHotkey launcher). The plugin then leaves the file
unparsed, and the launcher runs it with AutoHotkey v1.
</body>
