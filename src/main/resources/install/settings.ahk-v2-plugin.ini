[Deploy]
;Destination=C:\bin
;Destination=%A_MyDocuments%\AutoHotkey\Lib
;Message=Deploy {tool} to %DESTINATION%
;GenerateOverview=no
;Banner=Installed copy of {source-relative}, do not modify.`nEdit the source in project {project-name} and deploy.
;Banner=@standard
$find-banner$Banner=find:banner.txt
;RequiresAdmin=yes
;Compile=no
;EmbedOrigin=no

[Install]
$install$
;pictures\*.png=pictures

[InstallIfMissing]
$install-if-missing$

[AddBanner]
;*.ahk=no
;test\=no
$banner$
;readme.txt=line:#

[Cleanup]
$cleanup$
;*.tmp=%A_Temp%\{tool}\

[SetVersion]
$version$
scratch\=no
test\=no
;version.txt=line:#
