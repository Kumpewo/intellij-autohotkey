; settings.ahk-plugin.ini - settings of the AutoHotkey v2 plugin for the tool of this project
;
; One tool = one project: this file lies in the project root and is used by "Code > Deploy to Local Target..."
; and, for [SetVersion] only, by "Code > Set Version..." (which also works without this file). Details:
; Help > AutoHotkey Plugin Manual, page "Deploying tools and setting versions".
;
; Format: lines key=value in sections. Comments are lines starting with ";" (spaces before it are allowed);
; a ";" later in a line is part of the value. Section and key names are case-insensitive. Values may be enclosed
; in double quotes, which are removed. Every key, and every source in a section, may appear only once.
; The options below are commented out, so the defaults apply. A commented-out switch shows the value you set to
; change it (the default is named above it); remove the ";" to use an option.

[Install]
; Absolute folder for relative targets, usable as %DESTINATION% in targets and in Message. Without it all
; targets must be absolute. Environment variables (%USERPROFILE%) are resolved.
;Destination=C:\bin

; Text shown in the confirmation before anything is copied. `n is a line break, %% a percent sign;
; %DESTINATION% and environment variables are resolved.
;Message=Close the running {tool} first.`nThen press Deploy.

; true: copy all files in one process with administrator rights (one UAC prompt). Needed for protected folders
; such as C:\Program Files. The plugin does not find this out by itself. Default: false.
;RequiresAdmin=true

; true: show the destination, the compile step and the lines of [Overwrite] and [KeepExisting] in the
; confirmation. Default: true; false shows only the message (or a short question).
;GenerateOverview=false

; true: before copying, compile every executable named in [Overwrite] and [KeepExisting] (a source ending in .exe,
; without wildcards) from the script of the same name next to it, e.g. {tool}.exe from {tool}.ahk. Each script
; needs a line ;@Ahk2Exe-Base; a missing line or a compilation error stops the deployment before anything is
; copied. An executable without such a script is just copied. false: the executables are copied as they are; the
; confirmation warns if one is older than the scripts next to it. Default: true.
;CompileBeforeInstall=false

[Overwrite]
; Lines source=target; existing targets are replaced.
; Source: a file relative to the project root (no ..); * and ? are allowed in the file name, not in folder names.
; Target: absolute or relative to Destination. It is a folder (the file keeps its name) if it ends with \ or /,
; is . or .., is Destination itself, already exists as a folder, or if the source has a wildcard; otherwise it is
; the new file name. Missing folders are created. For several targets of one file use wildcards:
; {tool}.exe=dest1, {tool}.ex?=dest2. A tool with a GUI and a console variant lists both executables.
;{tool}.exe=.
;{tool}-console.exe=.
;pictures\*.png=pictures

[KeepExisting]
; Like [Overwrite], but a target that exists already is skipped (for configuration files you may have changed).
;{tool}.ini=%APPDATA%\{tool}\

[SetVersion]
; Lines path=exclude: "Code > Set Version..." leaves these files alone, even if they have a line
; ;@Ahk2Exe-SetVersion (e.g. experiments or old variants). The path is relative to the project root, like a source
; of [Overwrite] (* and ? only in the last name); ending with \ it names a folder with everything below it.
; This only concerns the version lines: commit and tag still need every file of the project to be versioned or
; ignored by Git. To keep files out of the commit, list them in .gitignore.
;scratch\=exclude
;old\=exclude
;test\=exclude
