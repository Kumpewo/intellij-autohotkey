# Build, test and verify the plugin on every push and pull request.
# Runs on Windows: the tests use Windows paths (#Include sub\file.ahk), and AutoHotkey itself is Windows-only.
# Tests that need an installed AutoHotkey or Ahk2Exe are skipped automatically on the runner.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# The job only reads the repository (checkout); uploading artifacts needs no token permission. Read-only also for
# workflows started by pull requests from forks, independent of the repository settings.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew.bat test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/

      - name: Build plugin
        run: ./gradlew.bat buildPlugin

      - name: Verify plugin against the recommended IDE versions
        run: ./gradlew.bat verifyPlugin -PverifyRecommendedIdes=true

      - name: Upload plugin verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip
